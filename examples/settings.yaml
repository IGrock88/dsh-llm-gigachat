# dsh-llm-gigachat — example settings for ~/.dsh/settings.yaml
#
# The plugin ships sane defaults; this section is only needed when you want
# to override them. Changes take effect on the next request (hot reload).

gigachat:
  enabled: true
  host: 127.0.0.1
  port: 8787
  upstreamBaseURL: https://api.giga.chat/v1
  # oauthURL: https://ngw.devices.sberbank.ru:9443/api/v2/oauth
  scope: GIGACHAT_API_PERS          # GIGACHAT_API_B2B or GIGACHAT_API_CORP for orgs
  apiKeyEnv: SBER_API_KEY
  providerId: sber
  displayName: Sber GigaChat
  maxConcurrency: 1
  tls:
    rejectUnauthorized: false       # NCC/НУЦ certs; set true after installing the root CA
  # Weaker models run WITHOUT tools by default (they reject complex agent
  # schemas or hallucinate tool calls). To give tools to one of them, remove
  # it from the list. Empty list = tools for every model.
  # stripToolsFor:
  #   - GigaChat-3-Lightning
  #   - GigaChat-2-Max
  #   - GigaChat-2-Pro
  #   - GigaChat-2
  models:                           # default catalog (GET /v1/models serves the live Sber list)
    - id: GigaChat-3-Ultra
      name: GigaChat 3 Ultra
    - id: GigaChat-3-Pro
      name: GigaChat 3 Pro
    - id: GigaChat-3-Lightning
      name: GigaChat 3 Lightning
    - id: GigaChat-2-Max
      name: GigaChat 2 Max
    - id: GigaChat-2-Pro
      name: GigaChat 2 Pro
    - id: GigaChat-2
      name: GigaChat 2